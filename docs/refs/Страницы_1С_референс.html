<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПерфТест — страницы интерфейса 1С (референс для сайта)</title>
<style>
  :root{--bg:#0f1319;--panel:#171e28;--panel2:#1e2733;--line:#2b3644;--txt:#e6eaf0;--dim:#8b98a9;--acc:#8b7cf6;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:13px/1.5 'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px 0;flex:0 0 auto}
  .top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12px}
  .grow{flex:1 1 auto}
  .hint{color:var(--dim);font-size:12px}
  nav{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--dim);
    padding:7px 12px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit}
  nav button:hover{color:var(--txt);background:var(--panel2)}
  nav button[aria-selected="true"]{background:var(--bg);color:var(--txt);border-color:var(--line);border-bottom-color:var(--bg);margin-bottom:-1px}
  .modes{display:flex;gap:8px;align-items:center;padding-bottom:8px}
  .modes button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:5px 10px;
    border-radius:6px;cursor:pointer;font:inherit}
  .modes button:hover{border-color:var(--acc)}
  .modes button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#12141a;font-weight:600}
  main{flex:1 1 auto;min-height:0;position:relative;background:var(--bg)}
  iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  pre{position:absolute;inset:0;margin:0;overflow:auto;background:#0b0f14;color:#cfd8e3;
    padding:16px;font:12px/1.55 Consolas,'Cascadia Mono',monospace;white-space:pre;tab-size:2}
  .note{position:absolute;right:14px;bottom:12px;background:rgba(23,30,40,.92);border:1px solid var(--line);
    color:var(--dim);padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>ПерфТест — страницы интерфейса 1С</h1>
    <span class="sub">выгрузка из 1С 8.3.27 (файловая ИБ), 08.11.2026</span>
    <span class="grow"></span>
    <span class="hint">Референс для сайта-копии: разметка, стили и тексты — как их отдаёт 1С</span>
  </div>
  <nav id="tabs" role="tablist"></nav>
  <div class="modes">
    <button id="mView" aria-pressed="true">Страница</button>
    <button id="mCode" aria-pressed="false">Исходный HTML</button>
    <button id="mCopy">Скопировать HTML</button>
    <button id="mOpen">Открыть в новой вкладке</button>
    <span class="hint" id="pageInfo"></span>
  </div>
</header>
<main>
  <iframe id="view" title="Страница 1С"></iframe>
  <pre id="code" hidden></pre>
  <div class="note" id="note" hidden></div>
</main>

 замера<\/div><\/section><section class='tile card row span-12 state-idle' id='card1' data-cat='cpu'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>01<\/span><h3 class='nm'>ЦПУ: арифметический цикл<\/h3><span class='code'>CPU_Арифметика<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>25 000 итераций &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:1'>Запустить<\/button><\/div><p class='why'>Суть: скорость исполнения встроенного языка на чистой арифметике - базовый потолок CPU без обращений к данным ИБ.<\/p><p class='why why-impl'>Реализация: цикл 25 000 итераций: умножение, деление, сравнение, присваивание; аккумулятор фиктивный (защита от выбрасывания вычислений).<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card2' data-cat='cpu'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>02<\/span><h3 class='nm'>ЦПУ: строковые операции<\/h3><span class='code'>CPU_Строки<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>4 000 сегментов &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:2'>Запустить<\/button><\/div><p class='why'>Суть: конвейер строковых операций - буферизация конкатенации через массив и поиск подстроки в склеенной строке.<\/p><p class='why why-impl'>Реализация: буфер-массив на 4 000 сегментов «0123456789abcdef+N», СтрСоединить в одну строку, затем СтрНайти «abcde» со сдвигом позиции на 10 символов; число поисков - длина строки / 10.<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card3' data-cat='cpu'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>03<\/span><h3 class='nm'>ЦПУ: коллекции<\/h3><span class='code'>CPU_Коллекции<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>10 000 элементов &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:3'>Запустить<\/button><\/div><p class='why'>Суть: менеджер памяти и хеш-таблицы встроенных коллекций - аллокации, вставки, полный обход.<\/p><p class='why why-impl'>Реализация: 10 000 добавлений параллельно в Массив и Соответствие, затем полный обход Соответствия с накоплением суммы; коллекции освобождаются.<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card4' data-cat='ib'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>04<\/span><h3 class='nm'>Запись ИБ: справочник, по одному<\/h3><span class='code'>Запись_СправочникБезТранзакции<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>10 записей &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:4'>Запустить<\/button><\/div><p class='why'>Суть: скорость точечной записи в файловую ИБ (dbeng8.dll в процессе клиента): транзакция на каждый объект и сброс страниц на диск - здесь заметны замененные библиотеки.<\/p><p class='why why-impl'>Реализация: 10 элементов справочника «Номенклатура (тест)», каждый - СоздатьЭлемент, Записать(); очистка тестовых элементов перед прогоном (вне замера).<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card5' data-cat='ib'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>05<\/span><h3 class='nm'>Запись ИБ: справочник, в одной транзакции<\/h3><span class='code'>Запись_СправочникВТранзакции<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>20 записей &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:5'>Запустить<\/button><\/div><p class='why'>Суть: те же записи справочника в одной большой транзакции; показывает цену пообъектных транзакций (контраст с карточкой 4).<\/p><p class='why why-impl'>Реализация: НачатьТранзакцию, 20 записей, ЗафиксироватьТранзакцию; при ошибке - ОтменитьТранзакцию.<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card6' data-cat='ib'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>06<\/span><h3 class='nm'>Запись ИБ: документы с проведением<\/h3><span class='code'>Запись_ДокументыСПроведением<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>5 документов &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:6'>Запустить<\/button><\/div><p class='why'>Суть: полный конвейер документа: объект + табличная часть + обработка проведения + движения регистра накопления + индексы.<\/p><p class='why why-impl'>Реализация: 5 документов «Поступление (тест)» по 5 строк, каждый - Записать(Проведение), движений - по одному на строку; номенклатура/склад готовятся вне замера.<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card7' data-cat='q'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>07<\/span><h3 class='nm'>Запросы: чтение и группировки<\/h3><span class='code'>Запросы_Чтение<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>15 пакетов &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:7'>Запустить<\/button><\/div><p class='why'>Суть: планировщик и исполнитель запросов: построение плана, чтение индексов, агрегация СУММА/КОЛИЧЕСТВО.<\/p><p class='why why-impl'>Реализация: 15 пакетов по два запроса: остатки виртуальной таблицы регистра накопления с группировкой и группировка по справочнику; данные создаются при нехватке (вне замера).<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card8' data-cat='ser'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>08<\/span><h3 class='nm'>Сериализация: JSON<\/h3><span class='code'>Сериализация_JSON<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>1 500 структур &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:8'>Запустить<\/button><\/div><p class='why'>Суть: скорость сериализации в JSON и обратного разбора - обмены, HTTP-сервисы, интеграции.<\/p><p class='why why-impl'>Реализация: 1 500 структур «имя-цена-признак»: ЗаписатьJSON в строку, затем ПрочитатьJSON обратно; построение массива вне замера.<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card9' data-cat='ser'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>09<\/span><h3 class='nm'>Сериализация: ЗначениеВСтрокуВнутр<\/h3><span class='code'>Сериализация_ЗначениеВСтроку<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>5 000 элементов &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:9'>Запустить<\/button><\/div><p class='why'>Суть: внутренняя сериализация платформы (ЗначениеВСтрокуВнутр) - хранилища настроек, передачи клиент-сервер.<\/p><p class='why why-impl'>Реализация: массив 5 000 чисел; три полных цикла ЗначениеВСтрокуВнутр -&gt; ЗначениеИзСтрокиВнутр.<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card10' data-cat='mem'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>10<\/span><h3 class='nm'>Память: коллекция строк<\/h3><span class='code'>Память_Коллекции<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>10 000 элементов &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:10'>Запустить<\/button><\/div><p class='why'>Суть: аллокатор платформы на множестве коротких строк - стоимость создания элементов и освобождения коллекции.<\/p><p class='why why-impl'>Реализация: 10 000 коротких строк «элемент-N» в массив, замер построения, затем освобождение.<\/p><p class='result'><\/p><\/div><\/section><section class='tile card row span-12 state-idle' id='card11' data-cat='io'><i class='edge'><\/i><i class='fill'><\/i><div class='r'><span class='idx'>11<\/span><h3 class='nm'>Файлы: запись и чтение текста<\/h3><span class='code'>Файлы_IO<\/span><span class='val'>&mdash;<\/span><span class='badge'>&mdash;<\/span><\/div><div class='more'><div class='more-in'><span class='desc'>3 000 строк &middot; <span class='reps' data-reps='1'>повторов 2<\/span><\/span><button class='btn primary' data-pf='run:11'>Запустить<\/button><\/div><p class='why'>Суть: файловый ввод-вывод средствами платформы (ЗаписьТекста/ЧтениеТекста, UTF-8) сквозь кэш записи ОС.<\/p><p class='why why-impl'>Реализация: запись 3 000 строк по ~104 символа (~305 КБ) во временный файл, построчное чтение с подсчетом длины, удаление файла.<\/p><p class='result'><\/p><\/div><\/section><section class='tile span-12'><div class='log-head'><h2>Журнал замеров<\/h2><span>стенд x сценарий<\/span><\/div><table><thead><tr><th class='n'>№<\/th><th>Сценарий<\/th><th>Стенд<\/th><th class='n'>Медиана, мс<\/th><th class='n'>мс/тыс.<\/th><th class='n'>Повторов<\/th><th class='n'>Мин...Макс<\/t const tabs = document.getElementById('tabs');
const view = document.getElementById('view');
const code = document.getElementById('code');
const note = document.getElementById('note');
const info = document.getElementById('pageInfo');
const btnView = document.getElementById('mView');
const btnCode = document.getElementById('mCode');
let current = 0;
let mode = 'view';

function renderTabs(){
  tabs.innerHTML = '';
  PAGES.forEach(function(p, i){
    const b = document.createElement('button');
    b.type = 'button';
    b.role = 'tab';
    b.textContent = p.title;
    b.setAttribute('aria-selected', i === current ? 'true' : 'false');
    b.addEventListener('click', function(){ select(i); });
    tabs.appendChild(b);
  });
}

function select(i){
  current = i;
  renderTabs();
  const p = PAGES[i];
  if (history.replaceState) { try { history.replaceState(null, '', '#' + p.id); } catch (e) {} }
  info.textContent = p.file + ' · ' + p.hint + ' · ' + Math.round(p.html.length / 1024) + ' КБ';
  code.textContent = p.html;
  if (mode === 'code') { code.hidden = false; view.hidden = true; }
  else { code.hidden = true; view.hidden = false; view.srcdoc = p.html; }
}

function setMode(m){
  mode = m;
  btnView.setAttribute('aria-pressed', m === 'view' ? 'true' : 'false');
  btnCode.setAttribute('aria-pressed', m === 'code' ? 'true' : 'false');
  select(current);
}

btnView.addEventListener('click', function(){ setMode('view'); });
btnCode.addEventListener('click', function(){ setMode('code'); });

document.getElementById('mCopy').addEventListener('click', async function(){
  const text = PAGES[current].html;
  try {
    await navigator.clipboard.writeText(text);
    flash('HTML скопирован (' + Math.round(text.length / 1024) + ' КБ)');
  } catch (e) {
    // Буфер обмена доступен не всегда (file://, политики) - показываем исходник.
    setMode('code');
    flash('Буфер недоступен: скопируйте из режима «Исходный HTML»');
  }
});

document.getElementById('mOpen').addEventListener('click', function(){
  const w = window.open('', '_blank');
  if (w) { w.document.write(PAGES[current].html); w.document.close(); }
});

function flash(msg){
  note.textContent = msg;
  note.hidden = false;
  clearTimeout(flash.t);
  flash.t = setTimeout(function(){ note.hidden = true; }, 2600);
}

document.addEventListener('keydown', function(e){
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' && current < PAGES.length - 1) select(current + 1);
  if (e.key === 'ArrowLeft' && current > 0) select(current - 1);
  if (e.key === '1') setMode('view');
  if (e.key === '2') setMode('code');
});

renderTabs();
// Стартовая страница - из hash (#dash, #cmp...), чтобы можно было давать ссылку.
const start = PAGES.findIndex(function(p){ return '#' + p.id === location.hash; });
select(start >= 0 ? start : 0);
