name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Политика выгрузки: BOM + CRLF + порядок служебных узлов. Ловит правки
  # XML руками и шум, который добавляет Конфигуратор при сохранении.
  dump-policy:
    name: Политика выгрузки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Нормализация (ожидается код 0)
        shell: pwsh
        run: ./tools/normalize-dump.ps1 -Path src

  # XML корректен, версия в выгрузке, README и CHANGELOG согласованы,
  # относительные ссылки в документации живые.
  dump-and-version:
    name: XML, версия, ссылки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: XML, BOM, окончания строк
        run: python tools/check-xml.py
      - name: Версия в выгрузке = README = CHANGELOG
        run: python tools/check-version.py
      - name: Ссылки в документации
        run: python tools/check-links.py
      # Клиентский код не трогает файлы: в клиенте, где платформа запрещает
      # синхронные методы (веб-клиент и подобные), ЗаписьТекста и
      # КаталогВременныхФайлов падают. В толстом и тонком клиенте Windows они
      # работают, поэтому дефект виден не на каждой сборке — нужен гейт.
      - name: Клиентский код без файловых вызовов
        run: python tools/check-client-io.py

  # Синтаксис BSL. Движок тот же, что локально: BSL Language Server 1.0.7.
  # Нужен исполняемый jar (-exec: 130 МБ, Spring Boot 4) и Java 21:
  # обычный -1.0.7.jar — библиотека без зависимостей, java -jar её не запустит.
  bsl:
    name: Синтаксис BSL
    runs-on: ubuntu-latest
    env:
      BSL_LS_URL: https://github.com/1c-syntax/bsl-language-server/releases/download/v1.0.7/bsl-language-server-1.0.7-exec.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Кэш jar (качается один раз на версию)
        uses: actions/cache@v4
        with:
          path: bsl-language-server.jar
          key: bsl-ls-1.0.7-exec
      - name: Получить BSL Language Server 1.0.7
        run: |
          if [ -f bsl-language-server.jar ]; then
            echo "jar из кэша"
          else
            # -f: падать на 4xx/5xx вместо сохранения HTML в .jar
            # --retry-all-errors: редирект на release-assets иногда обрывается
            curl -fL --http1.1 --retry 5 --retry-delay 2 --retry-all-errors \
              -o bsl-language-server.jar "$BSL_LS_URL"
          fi
          ls -l bsl-language-server.jar
          unzip -t bsl-language-server.jar > /dev/null
          java -jar bsl-language-server.jar --version
      - name: Анализ модулей
        run: |
          mkdir -p build/bsl
          java -jar bsl-language-server.jar analyze -s src -o build/bsl -r json -q || true
      - name: Разбор отчёта (падаем только на ERROR)
        run: python tools/check-bsl-report.py build/bsl

  # JS-мост внутри HTML-поля: баланс скобок и наличие функций моста.
  # BSL Language Server этого не видит, а регресс был реальным (кнопка
  # «Запустить все» не перерисовывала кокпит).
  html-bridge:
    name: JS-мост HTML-поля
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Проверить модули с PF1C
        run: |
          node tools/check-html-bridge.mjs \
            src/CommonModules/ПерфКокпит/Ext/Module.bsl \
            src/CommonModules/ПерфUI/Ext/Module.bsl